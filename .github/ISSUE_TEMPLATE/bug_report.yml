name: Fehlerbericht
description: Melde einen Fehler in der App
title: "[Fehler] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Danke für den Bericht. Bitte so genau wie möglich ausfüllen.
  - type: input
    id: version
    attributes:
      label: Version und Paket
      description: Zum Beispiel 0.1.0 Flatpak oder 0.1.0 APK.
    validations:
      required: true
  - type: textarea
    id: schritte
    attributes:
      label: Schritte zum Nachstellen
      placeholder: |
        1. App starten
        2. ...
    validations:
      required: true
  - type: textarea
    id: erwartet
    attributes:
      label: Erwartetes Verhalten
    validations:
      required: true
  - type: textarea
    id: tatsaechlich
    attributes:
      label: Tatsächliches Verhalten
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Betriebssystem und Gerät, zum Beispiel Fedora 42 oder Pixel mit Android 16.
